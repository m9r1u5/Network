name: Build Signal Finder APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest 2>&1 | tee build.log

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease 2>&1 | tee -a build.log

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "SignalFinder-v1.0.${{ github.run_number }}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Signal Finder v1.0.${{ github.run_number }}
          body: |
            Download **SignalFinder-v1.0.${{ github.run_number }}.apk** below and open it on your Android phone to install.
            Already installed? Just tap **Update** inside the app.
          files: SignalFinder-v1.0.${{ github.run_number }}.apk
          make_latest: true

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ && cd /tmp/logs
          git init -q && git checkout -q -b build-logs && git add build.log
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build log run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-logs
